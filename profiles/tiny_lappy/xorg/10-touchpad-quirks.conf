# Disable generic synaptics device

Section "InputClass"
	Identifier "Dummy touchpad ignore"
	MatchProduct "PS/2 Synaptics TouchPad"

	Option "Ignore" "true"
EndSection

# Same reasoning as xorg/30-mouse.conf: an InputClass applies on every
# device add, where startup.d/touchpad only runs at login. This pad gets
# re-added often - ubuntu/bin/touchpad-reset rebinds the i2c controller to
# clear a stuck contact, and each rebind drops every libinput property
# back to its default. Losing these is visible: scrolling inverts, the
# bottom-right corner starts right-clicking instead of two-finger click,
# the cursor slows, and drag goes sticky.
#
# MatchProduct substring-matches the device name, which would also catch
# "DLL075B:01 06CB:76AF Mouse" - the same hardware's pointer interface -
# so MatchIsTouchpad narrows it to the pad.

Section "InputClass"
	Identifier "DLL075B touchpad settings"
	MatchProduct "DLL075B"
	MatchIsTouchpad "on"

	Option "Tapping" "off"
	Option "TappingDrag" "off"
	Option "NaturalScrolling" "on"
	Option "ClickMethod" "clickfinger"
	Option "AccelSpeed" "0.5"
EndSection