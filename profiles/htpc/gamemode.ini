; Linked to ~/.config/gamemode.ini by dot-update.d/gamemode.

[gpu]
; The RX 580's automatic power management leaves VRAM at its 300 MHz floor while the
; game holds the card 90% busy (measured over three minutes of play: 176 of 180 samples
; at 300, never at 2000), which is the choppy frame rate. "high" holds the top clock
; steps for exactly as long as a game is running, and gamemode puts it back to "auto"
; when the game exits. It is the card's own top step, not an overclock.
apply_gpu_optimisations=accept-responsibility
gpu_device=0
amd_performance_level=high
