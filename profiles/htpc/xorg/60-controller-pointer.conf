# Pad-as-pointer for the couch when Steam isn't running. Steam Input drives
# the pointer only while Steam is up; the moment Big Picture exits, the pad
# is a joystick X ignores, and the box is dead from the chair. The joystick
# X driver (xserver-xorg-input-joystick, htpc aptfile) fills that gap, and
# bin/controller-pointer-gate switches this device off while Steam runs -
# Steam reads the pad without an exclusive grab (verified 2026-09: EVIOCGRAB
# succeeds beside a live Big Picture), so left on, both would act on every
# press.
#
# The layout follows Steam's desktop configuration so one set of habits
# covers both: left stick moves, right stick scrolls, A/X click, B is
# Escape, Y is Enter, d-pad is arrows. Keys are X keycodes from `xmodmap
# -pk` on this box (evdev layout, not per-language).
#
# Numbering is the driver's: buttons and axes count set evdev bits in code
# order, from 1. For this pad (xpad, X-input mode) that gives
#   buttons  1 A  2 B  3 X  4 Y  5 LB  6 RB  7 View  8 Menu  9 Guide
#            10 L-stick click  11 R-stick click
#   axes     1 LX  2 LY  3 LT  4 RX  5 RY  6 RT  7 d-pad X  8 d-pad Y
# Check a different pad with `evtest`: KEY codes ascending are the buttons,
# ABS codes ascending are the axes.

# The driver package ships a catchall that makes every joystick a pointer,
# which would put Steam's virtual "X-Box 360 pad" on the cursor mid-game.
# Restore X's default of leaving joysticks alone, then opt this one pad back
# in below - later InputClass sections override earlier ones, and /etc is
# parsed after /usr/share.
Section "InputClass"
	Identifier "joysticks are not pointers"
	MatchIsJoystick "on"
	Option "Ignore" "on"
EndSection

Section "InputClass"
	Identifier "8BitDo pad as desktop pointer"
	MatchIsJoystick "on"
	MatchProduct "8BitDo"
	Driver "joystick"
	Option "Ignore" "off"

	# Left stick: pointer. At factor 1 the driver's full-deflection rate is
	# ~650 px/s (jstk_axis.c: 9.8 px per 15 ms tick), a six-second crossing
	# of the 4K TV; 3x makes it two. LB held slows to a fifth for precision,
	# RB held doubles for crossing. Deadzone ~12%, above hall-effect drift.
	Option "MapAxis1" "mode=relative axis=+3x deadzone=4000"
	Option "MapAxis2" "mode=relative axis=+3y deadzone=4000"
	Option "MapButton5" "amplify=0.2"
	Option "MapButton6" "amplify=2"

	# Triggers: nothing. The driver can't put an axis on a mouse button.
	Option "MapAxis3" "mode=none"
	Option "MapAxis6" "mode=none"

	# Right stick: scroll (push down = scroll down)
	Option "MapAxis4" "mode=relative axis=+1zx deadzone=6000"
	Option "MapAxis5" "mode=relative axis=+1zy deadzone=6000"

	# D-pad: arrow keys, autorepeated by X while held
	Option "MapAxis7" "mode=accelerated keylow=113 keyhigh=114"
	Option "MapAxis8" "mode=accelerated keylow=111 keyhigh=116"

	Option "MapButton1" "button=1"
	Option "MapButton2" "key=9"
	Option "MapButton3" "button=3"
	Option "MapButton4" "key=36"
	# View: super+Tab (last desktop, .sxhkdrc); Menu: Tab
	Option "MapButton7" "key=133,23"
	Option "MapButton8" "key=23"
	# Guide is Steam's; L-stick click is middle click (open in new tab)
	Option "MapButton9" "none"
	Option "MapButton10" "button=2"
	Option "MapButton11" "none"
EndSection
