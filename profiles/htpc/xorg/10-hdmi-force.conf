# See profiles/htpc/dot-update.d/display-force - linked to
# /etc/X11/xorg.conf.d/10-hdmi-force.conf.
#
# The Denon drops DDC whenever it is not handshaking - powered off, or on
# another input - and does not bring it back when you switch the input
# again: it needs the source to re-initiate, which in practice means
# rebooting the box. So a boot that starts with the receiver elsewhere has
# no EDID for the whole session even after you select the right input.
#
# Without EDID the driver offers only its two built-in modes and X takes
# 640x480, which startup.d/display-fallback pulls back up to 1080p. The
# fatal part is earlier though: with no output enabled at all, bspwm exits
# the instant it starts, the session dies, and greetd's greeter takes the
# screen - a password prompt at a couch with no keyboard. Enable keeps an
# output on the server's books so the session survives a blind boot.
#
# No PreferredMode here on purpose. It would pin 1080p on every boot,
# including the healthy ones where EDID reads and this TV is 4K - X would
# start at 1080p and autorandr's htpc-tv profile would switch it up a
# moment later, and anything that sized itself in between (Steam Big
# Picture especially) would bake the wrong scale in. The blind case is the
# one that needs a mode chosen for it, and startup.d/display-fallback is
# where that belongs, because it can tell the two cases apart.
#
# Identifier is the Xorg output name, HDMI-A-0, not the kernel connector
# name HDMI-A-1 that video= and /sys/class/drm use. Same physical port, and
# amdgpu numbers them from 0 here and 1 there.
Section "Monitor"
	Identifier "HDMI-A-0"
	Option "Enable" "true"
EndSection
