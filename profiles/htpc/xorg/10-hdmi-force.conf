# See profiles/htpc/dot-update.d/display-force - linked to
# /etc/X11/xorg.conf.d/10-hdmi-force.conf.
#
# The Denon never answers DDC: every Xorg log this box has ever written
# reads zero EDID bytes. With no EDID the driver falls back to its two
# built-in modes, 1920x1080 and 640x480, and X picks 640x480 - so the couch
# UI comes up postage-stamp sized and every app that sizes itself at launch
# (Steam Big Picture especially) bakes in the wrong scale.
#
# PreferredMode names the one to take instead. The kernel's video= force
# (profiles/htpc/etc/grub) does not cover this - it pins the connector on
# and sets the *kernel* framebuffer mode, and X still chooses its own.
#
# Identifier is the Xorg output name, HDMI-A-0, not the kernel connector
# name HDMI-A-1 that video= and /sys/class/drm use. Same physical port, and
# amdgpu numbers them from 0 here and 1 there.
Section "Monitor"
	Identifier "HDMI-A-0"
	Option "Enable" "true"
	Option "PreferredMode" "1920x1080"
EndSection
